# Super Mario Strikers Online - settings.
# Mario Strikers Settings.exe edits this file too, and leaves [netplay] alone.
# Every setting the game knows is described in strikers.ini.example.

[paths]
# Your own copy of the game: a disc image or the "files" folder of an
# extracted disc. Use / instead of \
# data = C:/Games/Super Mario Strikers.iso

[display]
fullscreen = 0
window_size = 1280x720

[netplay]
# The relay server's address, from whoever runs it (name.ply.gg:12345).
# If you run the server yourself, put your own Playit address here.
server = 127.0.0.1:7200

# Smallest input delay, in frames of 20 ms. The game raises it from the
# ping when a match starts, so 2 is fine.
delay = 2

# 0 = lockstep: waits for the other player's input and never guesses
# (stable, recommended). 1-10 = rollback window in frames (experimental).
# Only the value of the player who creates the room counts.
rollback = 0

# Leave at 0: online play is started from the in-game menu (F1).
netplay = 0
